# 可读取的非秘密配置：check-config/replay保持离线；login/collect/logout见docs/CLOUD-COLLECTOR.md。
# 真实HTTP/MQTT代码已实现，未用真实账号验收。
# 不要填入密码、token、验证码或 LAN code。区域和设备必须由用户明确选择。

[provider]
kind = "bambu-cloud"
region = "cn"         # cn 或 global；按 Bambu 账号区域，不按电脑位置
printer_id = ""       # 空值是 unconfigured，不默认选择任何设备

[credentials]
reference = "bambu-monitor/cloud/default"  # 区域+逻辑槽隔离；原生密钥库优先，不可用则本次内存

[freshness]
# 目标遥测证据超时初值，未实机验证；不是逐字段 TTL 或云推送频率。
liveness_seconds = 60

[reconnect]
initial_delay_seconds = 1
max_delay_seconds = 60
jitter = true
# 认证拒绝进入 auth_required，不自动重登/发码。
# collect前台管理恢复；真实云、系统密钥库读写和停止预算仍待验证。
# 国区支持11位手机号password/SMS code，邮箱支持password/email code；网站MFA/TOTP未实现。
