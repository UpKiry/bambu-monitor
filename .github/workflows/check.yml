name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install preview fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,cloud]'
      - name: Offline build
        run: python tools/project.py build
      - name: Offline checks
        run: python tools/project.py check
      - name: Offline preview with existing atlas
        env:
          BAMBU_CJK_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python tools/project.py preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-python-${{ matrix.python-version }}
          path: .build/preview/*.png
