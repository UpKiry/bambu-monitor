[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-monitor"
version = "0.1.6"
description = "Bambu monitor PetUI build tools and offline cloud telemetry core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "UpKiry"}]
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.urls]
Homepage = "https://github.com/UpKiry/bambu-monitor"
Repository = "https://github.com/UpKiry/bambu-monitor"
Issues = "https://github.com/UpKiry/bambu-monitor/issues"

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4,<0.2"]
cloud = ["paho-mqtt==2.1.0", "keyring>=25.7,<26"]
tray = ["pystray==0.19.5; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=7.0; sys_platform == 'darwin'"]

[project.scripts]
bambu-monitor = "bambu_monitor.cli:main"

[tool.setuptools.package-data]
bambu_monitor = ["webui/*.html", "webui/*.js", "webui/*.css"]

[tool.setuptools.packages.find]
where = ["src"]
